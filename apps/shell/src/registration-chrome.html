<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: #f8fafc;
        border-bottom: 1px solid rgba(15, 23, 42, 0.1);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        color: #0f172a;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 24px;
      }

      button {
        min-height: 48px;
        min-width: 120px;
        border: none;
        border-radius: 16px;
        font-family: "DM Sans", system-ui, sans-serif;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease;
      }

      button:active {
        transform: scale(0.97);
      }

      .done {
        background: linear-gradient(135deg, #2563eb 0%, #0f172a 100%);
        color: #ffffff;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
      }
    </style>
  </head>
  <body>
    <button class="done" id="done">Done</button>
    <script>
      document.body.addEventListener("pointerdown", function () {
        window.electronAPI.notifyActivity();
        window.electronAPI.hideKeyboard();
      });

      document.getElementById("done").addEventListener("click", () => {
        window.electronAPI.closeRegistration();
      });
    </script>
  </body>
</html>
